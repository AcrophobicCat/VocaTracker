name: BQ to GitHub Export

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # ※必要に応じて調整してください

# 🌟 GitHub Pagesへのデプロイに必要な権限を追加
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-cloud-bigquery db-dtypes

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Export Script
        run: python export.py
        env:
          BQ_PROJECT_ID: "youtube-vocaloid-song-trackar"
          BQ_DATASET_ID: "data"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git status
          git diff-index --quiet HEAD || (git commit -m "Auto-export BQ logs to 500 parts [skip ci]" && git push)

      # 🌟 【追加】GitHub Pages配信用にリポジトリのファイルをアップロード
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # 🌟 【追加】ビルドした成果物をGitHub Pagesに正式にデプロイするジョブ
  deploy:
    needs: export
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
