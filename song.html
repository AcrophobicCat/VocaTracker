<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楽曲詳細 - VocaTracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://img.youtube.com https://*.firebaseio.com https://*.googleapis.com 'unsafe-inline';">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#0f172a',
            cardbg: '#1e293b'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
  </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2 text-cyan-400 hover:text-cyan-300 text-sm font-medium transition">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span class="hidden sm:inline">トップページ（一覧）に戻る</span>
        <span class="sm:hidden">トップに戻る</span>
      </a>

      <!-- PC用メニュー（中画面以上で表示） -->
      <div class="hidden md:flex items-center gap-4">
        <span id="adminStatusIndicator" class="text-xs text-slate-400">🔒 一般閲覧モード</span>
        <button onclick="toggleAdminMode()" id="adminToggleBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
          管理者切替
        </button>
      </div>

      <!-- スマホ用ハンバーガーボタン（小画面で表示） -->
      <div class="md:hidden flex items-center">
        <button onclick="toggleMobileMenu()" class="text-slate-300 hover:text-white p-1.5 rounded-lg bg-slate-800/80 border border-slate-700 transition">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- スマホ用ドロップダウンメニュー（初期非表示） -->
    <div id="mobileMenu" class="hidden md:hidden pt-3 pb-2 border-t border-slate-800 mt-3 space-y-3 px-2">
      <div class="flex items-center justify-between">
        <span id="mobileAdminStatusIndicator" class="text-xs text-slate-400">🔒 一般閲覧モード</span>
        <button onclick="toggleAdminMode()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
          管理者切替
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 space-y-6">
    
    <!-- Song Header Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-start gap-4 shadow-xl">
      <div class="space-y-2 flex-1 w-full">
        <div class="flex flex-wrap items-center gap-2">
          <span id="songStatusBadge" class="px-2.5 py-1 rounded text-xs font-bold bg-cyan-500/20 text-cyan-400">楽曲詳細</span>
          <span id="videoIdDisplay" class="text-xs text-slate-500 font-mono">ID: ---</span>
        </div>

        <!-- タイトル表示 ＆ 編集エリア -->
        <div class="space-y-2">
          <div class="flex items-center gap-3">
            <h1 id="songTitle" class="text-xl md:text-2xl font-extrabold text-white leading-snug">読み込み中...</h1>
            <button id="editTitleBtn" onclick="enableTitleEdit()" class="hidden bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs px-3 py-1 rounded-lg border border-slate-700 transition flex items-center gap-1 shrink-0">
              <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> 編集
            </button>
          </div>

          <!-- インライン編集用フォーム -->
          <div id="editTitleContainer" class="hidden flex gap-2 max-w-lg">
            <input type="text" id="editTitleInput" class="bg-slate-800 border border-cyan-500 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none w-full">
            <button onclick="saveCustomTitle()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs px-4 py-1.5 rounded-lg font-medium whitespace-nowrap transition">保存</button>
            <button onclick="cancelTitleEdit()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs px-3 py-1.5 rounded-lg whitespace-nowrap transition">キャンセル</button>
          </div>
        </div>

        <p class="text-sm text-cyan-400 font-medium">ボカロP: <span id="songProducer" class="underline">---</span></p>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <a id="youtubeLink" href="#" target="_blank" rel="noopener" class="bg-red-600 hover:bg-red-700 text-white text-xs font-medium py-2.5 px-4 rounded-xl transition flex items-center gap-1.5 shadow-lg">
          <i data-lucide="youtube" class="w-4 h-4"></i> YouTubeで視聴
        </a>
      </div>
    </div>

    <!-- 🏷️ タグ管理セクション (3分類) -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
      <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
        <i data-lucide="tag" class="w-4 h-4 text-cyan-400"></i> タグ情報
      </h3>

      <div class="space-y-3 text-sm">
        <!-- ① ボーカルタグ（管理者専用編集） -->
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xs text-slate-400 w-20 shrink-0 font-bold">ボーカル:</span>
          <div id="vocalTagsContainer" class="flex items-center gap-1.5 flex-wrap"></div>
          <button id="editVocalBtn" onclick="editAdminTags('vocal')" class="hidden text-[10px] bg-slate-800 hover:bg-slate-700 text-cyan-400 px-2 py-0.5 rounded border border-slate-700 transition">編集</button>
        </div>

        <!-- ② クレジットタグ（管理者専用編集） -->
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xs text-slate-400 w-20 shrink-0 font-bold">クレジット:</span>
          <div id="creditTagsContainer" class="flex items-center gap-1.5 flex-wrap"></div>
          <button id="editCreditBtn" onclick="editAdminTags('credit')" class="hidden text-[10px] bg-slate-800 hover:bg-slate-700 text-cyan-400 px-2 py-0.5 rounded border border-slate-700 transition">編集</button>
        </div>

        <!-- ③ フリータグ（追加は誰でもOK、削除は管理者のみ） -->
        <div class="flex items-start gap-2 flex-wrap pt-2 border-t border-slate-800">
          <span class="text-xs text-slate-400 w-20 shrink-0 font-bold pt-1">フリータグ:</span>
          <div class="flex-1 space-y-2">
            <div id="freeTagsContainer" class="flex items-center gap-1.5 flex-wrap"></div>
            
            <!-- 追加入力フォーム -->
            <div class="flex items-center gap-1.5 max-w-xs">
              <input type="text" id="newFreeTagInput" list="existingTagsList" placeholder="タグを追加 (候補が出ます)..." class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-cyan-500 w-full">
              <datalist id="existingTagsList"></datalist>
              <button onclick="addFreeTag()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs px-3 py-1 rounded-lg font-medium transition whitespace-nowrap">追加</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Key Metrics Summary Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg space-y-1">
        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1">
          <i data-lucide="eye" class="w-3.5 h-3.5 text-cyan-400"></i> 現在の再生数
        </p>
        <p id="statCurrentViews" class="text-xl font-black text-white">---</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg space-y-1">
        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1">
          <i data-lucide="trending-up" class="w-3.5 h-3.5 text-emerald-400"></i> 直近の毎時増加
        </p>
        <p id="statHourlyInc" class="text-xl font-black text-emerald-400">---</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg space-y-1">
        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1">
          <i data-lucide="heart" class="w-3.5 h-3.5 text-rose-400"></i> 高評価数
        </p>
        <p id="statLikes" class="text-xl font-black text-slate-200">---</p>
      </div>
    </div>

    <!-- Charts Grid Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- 累計再生数の推移グラフ -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 shadow-xl">
        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
          <i data-lucide="trending-up" class="w-4 h-4 text-cyan-400"></i> 累計再生数の推移
        </h3>
        <div class="h-64 w-full">
          <canvas id="viewsChart"></canvas>
        </div>
      </div>

      <!-- 日間再生数（0:15基準）の棒グラフ -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 shadow-xl flex flex-col justify-between">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="bar-chart-2" class="w-4 h-4 text-emerald-400"></i> 1日の再生数 (0:15基準)
          </h3>
          <span class="text-[10px] text-slate-400">※バーをクリックして絞り込み</span>
        </div>
        <div class="h-60 w-full">
          <canvas id="dailyBarChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Historical Data Table -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="table" class="w-4 h-4 text-purple-400"></i> 時間ごとの推移表 (直近30件)
          </h3>
          <span id="tableFilterStatus" class="text-[10px] bg-cyan-500/20 text-cyan-400 px-2 py-0.5 rounded hidden"></span>
        </div>
        <button id="resetFilterBtn" onclick="resetFilter()" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-2.5 py-1 rounded hidden transition">
          フィルター解除（全表示）
        </button>
      </div>
      <div class="overflow-x-auto max-h-80">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-800/60 text-slate-400 uppercase sticky top-0">
            <tr>
              <th class="p-3">確認日時 (updated_at)</th>
              <th class="p-3 text-right">再生数 (views)</th>
              <th class="p-3 text-right">増加分 (hourly_inclease)</th>
              <th class="p-3 text-right">高評価数 (like_count)</th>
            </tr>
          </thead>
          <tbody id="logTableBody" class="divide-y divide-slate-800">
            <!-- JavaScriptで動的に挿入されます -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Firebase Initialization Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBFxeCvbpyj0_skQ5O7ZjGQz5EJ5YvQEmw",
      authDomain: "vocaloid-song-trackar.firebaseapp.com",
      projectId: "youtube-vocaloid-song-trackar",
      storageBucket: "youtube-vocaloid-song-trackar.firebasestorage.app",
      messagingSenderId: "543125801305",
      appId: "1:543125801305:web:7556f46309f798105f6448",
      measurementId: "G-L6NMKP7QQQ"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
  </script>

  <!-- Application Logic Script -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('id');

    let allLogsForSong = [];
    let viewsChartInstance = null;
    let dailyBarChartInstance = null;
    let isAdminMode = localStorage.getItem('voca_admin_mode') === 'true';

    // 🌟 修正: vocaloid_tracker_logs_30d.json を fetch で非同期読み込みする仕組みに変更
    async function initSongPage() {
      if (!videoId) {
        document.getElementById('songTitle').innerText = '楽曲IDが指定されていません。';
        return;
      }

      updateAdminUI();

      let allLogs = [];
      try {
        const response = await fetch('vocaloid_tracker_logs_30d.json');
        if (response.ok) {
          allLogs = await response.json();
          // 取得成功したらローカルストレージにもキャッシュとして保存
          localStorage.setItem('vocaloid_tracker_logs_30d', JSON.stringify(allLogs));
        }
      } catch (e) {
        console.log('JSONの非同期取得に失敗しました（ローカル環境など）。localStorageのキャッシュを使用します。', e);
      }

      // JSON取得に失敗した場合や空の場合は、localStorageやサンプルデータにフォールバック
      if (!allLogs || allLogs.length === 0) {
        allLogs = JSON.parse(localStorage.getItem('vocaloid_tracker_logs_30d')) || getSampleLogs(videoId);
      }

      allLogsForSong = allLogs
        .filter(log => log.video_id === videoId)
        .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

      if (allLogsForSong.length === 0) {
        document.getElementById('songTitle').innerText = `動画ID: ${videoId} のデータが見つかりません`;
        document.getElementById('videoIdDisplay').innerText = `ID: ${videoId}`;
        document.getElementById('youtubeLink').href = `https://www.youtube.com/watch?v=${videoId}`;
        return;
      }

      const latest = allLogsForSong[0];
      
      const customTitles = JSON.parse(localStorage.getItem('voca_custom_titles')) || {};
      const displayTitle = customTitles[videoId] || latest.title || `動画ID: ${videoId}`;

      document.getElementById('songTitle').innerText = displayTitle;
      document.getElementById('songProducer').innerText = latest.producer || '不明なP';
      document.getElementById('videoIdDisplay').innerText = `ID: ${videoId}`;
      document.getElementById('youtubeLink').href = `https://www.youtube.com/watch?v=${videoId}`;

      // スタッツカードの数値を反映
      document.getElementById('statCurrentViews').innerText = (latest.views || 0).toLocaleString();
      document.getElementById('statHourlyInc').innerText = `+${(latest.hourly_inclease || 0).toLocaleString()}`;
      document.getElementById('statLikes').innerText = (latest.like_count || 0).toLocaleString();

      // タグの読み込み ＆ 描画
      renderTags();
      updateTagSuggestions();

      // グラフ用データ構築
      const chronologicalLogs = [...allLogsForSong].reverse();
      const labels = chronologicalLogs.map(l => l.updated_at);
      const viewValues = chronologicalLogs.map(l => l.views);

      const dailyMap = {};
      chronologicalLogs.forEach(l => {
        const dayStr = l.updated_at.split(' ')[0];
        if (!dailyMap[dayStr]) dailyMap[dayStr] = 0;
        dailyMap[dayStr] += (l.hourly_inclease || 0);
      });
      const dailyLabels = Object.keys(dailyMap);
      const dailyValues = Object.values(dailyMap);

      renderViewsChart(labels, viewValues);
      renderDailyBarChart(dailyLabels, dailyValues, chronologicalLogs);
      renderLogTable(allLogsForSong.slice(0, 30));
    }

    // ハンバーガーメニューの開閉制御
    function toggleMobileMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('hidden');
    }

    // 🏷️ タグ管理機能のロジック
    function getSongTags() {
      const allTags = JSON.parse(localStorage.getItem('voca_song_tags')) || {};
      return allTags[videoId] || { vocal: ['初音ミク'], credit: ['Music: サンプルP'], free: ['ボカロ曲', '新曲'] };
    }

    function saveSongTags(tagsObj) {
      const allTags = JSON.parse(localStorage.getItem('voca_song_tags')) || {};
      allTags[videoId] = tagsObj;
      localStorage.setItem('voca_song_tags', JSON.stringify(allTags));

      let masterFree = JSON.parse(localStorage.getItem('voca_master_free_tags')) || ['ボカロ曲', '新曲', 'ミリオン達成', '神曲', 'EDM'];
      tagsObj.free.forEach(t => {
        if (!masterFree.includes(t)) masterFree.push(t);
      });
      localStorage.setItem('voca_master_free_tags', JSON.stringify(masterFree));
      
      renderTags();
      updateTagSuggestions();
    }

    function renderTags() {
      const tags = getSongTags();
      
      // ① ボーカル
      const vContainer = document.getElementById('vocalTagsContainer');
      vContainer.innerHTML = tags.vocal.map(t => `<span class="bg-purple-900/40 text-purple-300 border border-purple-700/50 text-xs px-2.5 py-0.5 rounded-full">${t}</span>`).join('') || '<span class="text-xs text-slate-500">未設定</span>';

      // ② クレジット
      const cContainer = document.getElementById('creditTagsContainer');
      cContainer.innerHTML = tags.credit.map(t => `<span class="bg-indigo-900/40 text-indigo-300 border border-indigo-700/50 text-xs px-2.5 py-0.5 rounded-full">${t}</span>`).join('') || '<span class="text-xs text-slate-500">未設定</span>';

      // ③ フリー（管理者モードのときだけ削除ボタンを表示）
      const fContainer = document.getElementById('freeTagsContainer');
      fContainer.innerHTML = tags.free.map(t => {
        let deleteBtnHtml = isAdminMode ? `<button onclick="removeFreeTag('${t}')" class="hover:text-red-400 font-bold ml-1">×</button>` : '';
        return `<span class="bg-cyan-900/40 text-cyan-300 border border-cyan-700/50 text-xs px-2.5 py-0.5 rounded-full flex items-center gap-1">${t} ${deleteBtnHtml}</span>`;
      }).join('') || '<span class="text-xs text-slate-500">タグなし</span>';
    }

    function updateTagSuggestions() {
      const masterFree = JSON.parse(localStorage.getItem('voca_master_free_tags')) || ['ボカロ曲', '新曲', 'ミリオン達成', '神曲', 'EDM'];
      const datalist = document.getElementById('existingTagsList');
      datalist.innerHTML = masterFree.map(t => `<option value="${t}"></option>`).join('');
    }

    function addFreeTag() {
      const input = document.getElementById('newFreeTagInput');
      const val = input.value.trim();
      if (!val) return;

      const tags = getSongTags();
      if (!tags.free.includes(val)) {
        tags.free.push(val);
        saveSongTags(tags);
      }
      input.value = '';
    }

    function removeFreeTag(tagToRemove) {
      if (!isAdminMode) return;
      const tags = getSongTags();
      tags.free = tags.free.filter(t => t !== tagToRemove);
      saveSongTags(tags);
    }

    function editAdminTags(type) {
      if (!isAdminMode) return;
      const tags = getSongTags();
      const label = type === 'vocal' ? 'ボーカルタグ' : 'クレジットタグ';
      const currentVal = tags[type].join(', ');
      
      const newVal = prompt(`${label}をカンマ（,）区切りで入力してください:`, currentVal);
      if (newVal !== null) {
        tags[type] = newVal.split(',').map(s => s.trim()).filter(Boolean);
        saveSongTags(tags);
      }
    }

    function toggleAdminMode() {
      isAdminMode = !isAdminMode;
      localStorage.setItem('voca_admin_mode', isAdminMode);
      updateAdminUI();
      renderTags();
    }

    function updateAdminUI() {
      const indicator = document.getElementById('adminStatusIndicator');
      const mobileIndicator = document.getElementById('mobileAdminStatusIndicator');
      const editBtn = document.getElementById('editTitleBtn');

      const editVocalBtn = document.getElementById('editVocalBtn');
      const editCreditBtn = document.getElementById('editCreditBtn');

      if (isAdminMode) {
        const text = '🔓 管理者モード';
        const className = 'text-xs text-cyan-400 font-bold';
        
        indicator.innerText = text;
        indicator.className = className;
        mobileIndicator.innerText = text;
        mobileIndicator.className = className;

        editBtn.classList.remove('hidden');
        editVocalBtn.classList.remove('hidden');
        editCreditBtn.classList.remove('hidden');
      } else {
        const text = '🔒 一般閲覧モード';
        const className = 'text-xs text-slate-400';

        indicator.innerText = text;
        indicator.className = className;
        mobileIndicator.innerText = text;
        mobileIndicator.className = className;

        editBtn.classList.add('hidden');
        editVocalBtn.classList.add('hidden');
        editCreditBtn.classList.add('hidden');
        cancelTitleEdit();
      }
    }

    function enableTitleEdit() {
      const currentTitle = document.getElementById('songTitle').innerText;
      document.getElementById('editTitleInput').value = currentTitle;
      document.getElementById('songTitle').classList.add('hidden');
      document.getElementById('editTitleBtn').classList.add('hidden');
      document.getElementById('editTitleContainer').classList.remove('hidden');
    }

    function cancelTitleEdit() {
      document.getElementById('songTitle').classList.remove('hidden');
      if (isAdminMode) document.getElementById('editTitleBtn').classList.remove('hidden');
      document.getElementById('editTitleContainer').classList.add('hidden');
    }

    function saveCustomTitle() {
      const newTitle = document.getElementById('editTitleInput').value.trim();
      if (!newTitle) return;

      const customTitles = JSON.parse(localStorage.getItem('voca_custom_titles')) || {};
      customTitles[videoId] = newTitle;
      localStorage.setItem('voca_custom_titles', JSON.stringify(customTitles));

      document.getElementById('songTitle').innerText = newTitle;
      cancelTitleEdit();
      alert('タイトルを保存しました！');
    }

    function renderViewsChart(labels, data) {
      const ctx = document.getElementById('viewsChart').getContext('2d');
      if (viewsChartInstance) viewsChartInstance.destroy();

      viewsChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '累計再生数 (views)',
            data: data,
            borderColor: '#06b6d4',
            backgroundColor: 'rgba(6, 182, 212, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } }
          }
        }
      });
    }

    function renderDailyBarChart(labels, data, chronologicalLogs) {
      const ctx = document.getElementById('dailyBarChart').getContext('2d');
      if (dailyBarChartInstance) dailyBarChartInstance.destroy();

      dailyBarChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '増加分合算',
            data: data,
            backgroundColor: '#0ea5e9',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          onClick: (event, elements) => {
            if (elements.length > 0) {
              const index = elements[0].index;
              const selectedDay = labels[index];
              filterByDay(selectedDay, chronologicalLogs);
            }
          },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } }
          }
        }
      });
    }

    function filterByDay(dayStr, chronologicalLogs) {
      const filtered = allLogsForSong.filter(l => l.updated_at.startsWith(dayStr));
      renderLogTable(filtered.slice(0, 30));

      const statusBadge = document.getElementById('tableFilterStatus');
      statusBadge.innerText = `表示日: ${dayStr}`;
      statusBadge.classList.remove('hidden');
      document.getElementById('resetFilterBtn').classList.remove('hidden');

      const dayLogs = chronologicalLogs.filter(l => l.updated_at.startsWith(dayStr));
      if (dayLogs.length > 0) {
        renderViewsChart(dayLogs.map(l => l.updated_at), dayLogs.map(l => l.views));
      }
    }

    function resetFilter() {
      renderLogTable(allLogsForSong.slice(0, 30));
      const chronologicalLogs = [...allLogsForSong].reverse();
      renderViewsChart(chronologicalLogs.map(l => l.updated_at), chronologicalLogs.map(l => l.views));

      document.getElementById('tableFilterStatus').classList.add('hidden');
      document.getElementById('resetFilterBtn').classList.add('hidden');
    }

    function renderLogTable(logs) {
      const tbody = document.getElementById('logTableBody');
      if (!logs || logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">ログデータがありません</td></tr>`;
        return;
      }
      tbody.innerHTML = logs.map(log => `
        <tr class="hover:bg-slate-800/40 transition">
          <td class="p-3 text-slate-400">${log.updated_at}</td>
          <td class="p-3 text-right font-medium text-slate-200">${(log.views || 0).toLocaleString()}</td>
          <td class="p-3 text-right text-cyan-400">+${(log.hourly_inclease || 0).toLocaleString()}</td>
          <td class="p-3 text-right text-slate-300">${(log.like_count || 0).toLocaleString()}</td>
        </tr>
      `).join('');
    }

    function getSampleLogs(vid) {
      return [
        { video_id: vid, title: 'サンプル楽曲 / 初音ミク', producer: 'サンプルP', views: 230035917, hourly_inclease: 7771, like_count: 2251047, updated_at: '2026/11/02 09:00:25' },
        { video_id: vid, title: 'サンプル楽曲 / 初音ミク', producer: 'サンプルP', views: 230028146, hourly_inclease: 9454, like_count: 2251023, updated_at: '2026/11/02 08:00:30' },
        { video_id: vid, title: 'サンプル楽曲 / 初音ミク', producer: 'サンプルP', views: 230018692, hourly_inclease: 7481, like_count: 2250979, updated_at: '2026/11/02 07:00:40' }
      ];
    }

    window.onload = () => {
      initSongPage();
      lucide.createIcons();
    };
  </script>
</body>
</html>
