<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楽曲詳細 - VocaTracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://img.youtube.com https://*.firebaseio.com https://*.googleapis.com 'unsafe-inline';">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#0f172a',
            cardbg: '#1e293b'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
  </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2 text-cyan-400 hover:text-cyan-300 text-sm font-medium">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>トップページ（一覧）に戻る</span>
      </a>
      <span id="adminStatusIndicator" class="text-xs text-slate-400">🔒 一般閲覧モード</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 space-y-6">
    
    <!-- Song Header Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-start gap-4">
      <div class="space-y-2 flex-1 w-full">
        <div class="flex flex-wrap items-center gap-2">
          <span id="songStatusBadge" class="px-2.5 py-1 rounded text-xs font-bold bg-cyan-500/20 text-cyan-400">楽曲詳細</span>
          <span id="videoIdDisplay" class="text-xs text-slate-500 font-mono">ID: ---</span>
        </div>

        <div>
          <h1 id="songTitle" class="text-xl md:text-2xl font-extrabold text-white leading-snug">読み込み中...</h1>
        </div>

        <p class="text-sm text-cyan-400 font-medium">ボカロP: <span id="songProducer" class="underline cursor-pointer">---</span></p>
      </div>

      <div class="flex items-center gap-2">
        <a id="youtubeLink" href="#" target="_blank" rel="noopener" class="bg-red-600 hover:bg-red-700 text-white text-xs font-medium py-2.5 px-4 rounded-xl transition flex items-center gap-1.5 shadow-lg">
          <i data-lucide="youtube" class="w-4 h-4"></i> YouTubeで視聴
        </a>
      </div>
    </div>

    <!-- Charts Grid Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- 累計再生数の推移グラフ -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 shadow-xl">
        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
          <i data-lucide="trending-up" class="w-4 h-4 text-cyan-400"></i> 累計再生数の推移
        </h3>
        <div class="h-64 w-full">
          <canvas id="viewsChart"></canvas>
        </div>
      </div>

      <!-- 日間再生数（0:15基準）の棒グラフ -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 shadow-xl flex flex-col justify-between">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="bar-chart-2" class="w-4 h-4 text-emerald-400"></i> 1日の再生数 (0:15基準)
          </h3>
          <span class="text-[10px] text-slate-400">※バーをクリックして絞り込み</span>
        </div>
        <div class="h-60 w-full">
          <canvas id="dailyBarChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Historical Data Table -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="table" class="w-4 h-4 text-purple-400"></i> 時間ごとの推移表
          </h3>
          <span id="tableFilterStatus" class="text-[10px] bg-cyan-500/20 text-cyan-400 px-2 py-0.5 rounded hidden"></span>
        </div>
        <button id="resetFilterBtn" onclick="resetFilter()" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-2.5 py-1 rounded hidden transition">
          フィルター解除（全表示）
        </button>
      </div>
      <div class="overflow-x-auto max-h-80">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-800/60 text-slate-400 uppercase sticky top-0">
            <tr>
              <th class="p-3">確認日時</th>
              <th class="p-3 text-right">再生数</th>
              <th class="p-3 text-right">再生数の増加分</th>
              <th class="p-3 text-right">高評価数</th>
            </tr>
          </thead>
          <tbody id="logTableBody" class="divide-y divide-slate-800">
            <!-- JavaScriptで動的に挿入されます -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Script for Rendering Charts & Table with Cross-filtering -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('id');

    let currentSongData = null;
    let viewsChartInstance = null;
    let dailyBarChartInstance = null;

    function initSongPage() {
      if (!videoId) {
        document.getElementById('songTitle').innerText = '楽曲IDが指定されていません。';
        return;
      }

      const songs = JSON.parse(localStorage.getItem('vocaloid_tracker_songs_v3')) || [];
      const song = songs.find(s => s.video_id === videoId) || {
        video_id: videoId,
        title: 'サンプル楽曲タイトル',
        producer: 'サンプルP',
        views: 230035917,
        history_dates: ['10/03', '10/08', '10/13', '10/18', '10/23', '10/28', '11/02'],
        history_views: [224000000, 225000000, 226000000, 227000000, 228000000, 229000000, 230035917],
        daily_data: [
          { date: '10/27', increase: 10000 },
          { date: '10/28', increase: 16000 },
          { date: '10/29', increase: 12000 },
          { date: '10/30', increase: 14000 },
          { date: '10/31', increase: 10000 },
          { date: '11/01', increase: 12500 },
          { date: '11/02', increase: 7771 }
        ],
        logs: [
          { updated_at: '2026/11/02 9:00:25', date: '11/02', views: 230035917, increase: 7771, likes: 2251047 },
          { updated_at: '2026/11/02 8:00:30', date: '11/02', views: 230028146, increase: 9454, likes: 2251023 },
          { updated_at: '2026/11/02 7:00:40', date: '11/02', views: 230018692, increase: 7481, likes: 2250979 },
          { updated_at: '2026/11/02 6:00:14', date: '11/02', views: 230011211, increase: 6892, likes: 2250946 },
          { updated_at: '2026/11/02 5:00:18', date: '11/02', views: 230004319, increase: 7588, likes: 2250905 },
          { updated_at: '2026/11/01 23:00:00', date: '11/01', views: 229950000, increase: 5000, likes: 2250000 },
          { updated_at: '2026/11/01 12:00:00', date: '11/01', views: 229920000, increase: 6000, likes: 2249000 },
          { updated_at: '2026/10/31 12:00:00', date: '10/31', views: 229850000, increase: 10000, likes: 2248000 },
          { updated_at: '2026/10/30 12:00:00', date: '10/30', views: 229750000, increase: 14000, likes: 2247000 },
          { updated_at: '2026/10/29 12:00:00', date: '10/29', views: 229600000, increase: 12000, likes: 2246000 },
          { updated_at: '2026/10/28 12:00:00', date: '10/28', views: 229450000, increase: 16000, likes: 2245000 },
          { updated_at: '2026/10/27 12:00:00', date: '10/27', views: 229300000, increase: 10000, likes: 2244000 }
        ]
      };

      currentSongData = song;

      document.getElementById('songTitle').innerText = song.title || `動画ID: ${videoId}`;
      document.getElementById('songProducer').innerText = song.producer || '不明なP';
      document.getElementById('videoIdDisplay').innerText = `ID: ${videoId}`;
      document.getElementById('youtubeLink').href = `https://www.youtube.com/watch?v=${videoId}`;
      if (song.buzz_status) {
        document.getElementById('songStatusBadge').innerText = song.buzz_status;
      }

      // 初期描画（全データ、表は直近30個に制限）
      renderViewsChart(song.history_dates, song.history_views);
      renderDailyBarChart(song.daily_data);
      renderLogTable(song.logs.slice(0, 30));
    }

    function renderViewsChart(labels, data) {
      const ctx = document.getElementById('viewsChart').getContext('2d');
      if (viewsChartInstance) viewsChartInstance.destroy();

      viewsChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '累計再生数',
            data: data,
            borderColor: '#06b6d4',
            backgroundColor: 'rgba(6, 182, 212, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } }
          }
        }
      });
    }

    function renderDailyBarChart(dailyData) {
      const ctx = document.getElementById('dailyBarChart').getContext('2d');
      if (dailyBarChartInstance) dailyBarChartInstance.destroy();

      const labels = dailyData.map(d => d.date);
      const data = dailyData.map(d => d.increase);

      dailyBarChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '1日の再生数',
            data: data,
            backgroundColor: '#0ea5e9',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          onClick: (event, elements) => {
            if (elements.length > 0) {
              const index = elements[0].index;
              const selectedDate = labels[index];
              filterByDate(selectedDate);
            }
          },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } }
          }
        }
      });
    }

    // クロスフィルタリング処理
    function filterByDate(dateStr) {
      if (!currentSongData || !currentSongData.logs) return;

      const filteredLogs = currentSongData.logs.filter(log => log.date === dateStr);

      renderLogTable(filteredLogs.slice(0, 30));

      const statusBadge = document.getElementById('tableFilterStatus');
      statusBadge.innerText = `表示中: ${dateStr}`;
      statusBadge.classList.remove('hidden');
      document.getElementById('resetFilterBtn').classList.remove('hidden');

      if (filteredLogs.length > 0) {
        const sortedLogs = [...filteredLogs].sort((a, b) => new Date(a.updated_at) - new Date(b.updated_at));
        const timeLabels = sortedLogs.map(l => l.updated_at.split(' ')[1] || l.updated_at);
        const timeViews = sortedLogs.map(l => l.views);
        renderViewsChart(timeLabels, timeViews);
      }
    }

    function resetFilter() {
      if (!currentSongData) return;
      renderLogTable(currentSongData.logs.slice(0, 30));
      renderViewsChart(currentSongData.history_dates, currentSongData.history_views);

      document.getElementById('tableFilterStatus').classList.add('hidden');
      document.getElementById('resetFilterBtn').classList.add('hidden');
    }

    function renderLogTable(logs) {
      const tbody = document.getElementById('logTableBody');
      if (!logs || logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">該当するログデータはありません</td></tr>`;
        return;
      }
      tbody.innerHTML = logs.map(log => `
        <tr class="hover:bg-slate-800/40 transition">
          <td class="p-3 text-slate-400">${log.updated_at}</td>
          <td class="p-3 text-right font-medium text-slate-200">${log.views.toLocaleString()}</td>
          <td class="p-3 text-right text-cyan-400">+${log.increase.toLocaleString()}</td>
          <td class="p-3 text-right text-slate-300">${log.likes.toLocaleString()}</td>
        </tr>
      `).join('');
    }

    window.onload = () => {
      initSongPage();
      lucide.createIcons();
    };
  </script>
</body>
</html>
