<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楽曲詳細 - VocaTracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://img.youtube.com https://*.firebaseio.com https://*.googleapis.com 'unsafe-inline';">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#0f172a',
            cardbg: '#1e293b'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
  </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2 text-cyan-400 hover:text-cyan-300 text-sm font-medium">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>トップページ（一覧）に戻る</span>
      </a>
      <div class="flex items-center gap-3">
        <span id="adminStatusIndicator" class="text-xs text-slate-400">🔒 一般閲覧モード</span>
        <button onclick="toggleAdminMode()" id="adminToggleBtn" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded border border-slate-700 transition">
          管理者切替
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 space-y-6">
    
    <!-- Song Header Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-start gap-4">
      <div class="space-y-2 flex-1 w-full">
        <div class="flex flex-wrap items-center gap-2">
          <span id="songStatusBadge" class="px-2.5 py-1 rounded text-xs font-bold bg-cyan-500/20 text-cyan-400">楽曲詳細</span>
          <span id="videoIdDisplay" class="text-xs text-slate-500 font-mono">ID: ---</span>
        </div>

        <!-- タイトル表示 ＆ 編集エリア -->
        <div class="space-y-2">
          <div class="flex items-center gap-3">
            <h1 id="songTitle" class="text-xl md:text-2xl font-extrabold text-white leading-snug">読み込み中...</h1>
            <!-- 管理者モード時のみ表示される編集ボタン -->
            <button id="editTitleBtn" onclick="enableTitleEdit()" class="hidden bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs px-3 py-1 rounded-lg border border-slate-700 transition flex items-center gap-1 shrink-0">
              <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> 編集
            </button>
          </div>

          <!-- インライン編集用フォーム（初期非表示） -->
          <div id="editTitleContainer" class="hidden flex gap-2 max-w-lg">
            <input type="text" id="editTitleInput" class="bg-slate-800 border border-cyan-500 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none w-full">
            <button onclick="saveCustomTitle()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs px-4 py-1.5 rounded-lg font-medium whitespace-nowrap">保存</button>
            <button onclick="cancelTitleEdit()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs px-3 py-1.5 rounded-lg whitespace-nowrap">キャンセル</button>
          </div>
        </div>

        <p class="text-sm text-cyan-400 font-medium">ボカロP: <span id="songProducer" class="underline">---</span></p>
      </div>

      <div class="flex items-center gap-2">
        <a id="youtubeLink" href="#" target="_blank" rel="noopener" class="bg-red-600 hover:bg-red-700 text-white text-xs font-medium py-2.5 px-4 rounded-xl transition flex items-center gap-1.5 shadow-lg">
          <i data-lucide="youtube" class="w-4 h-4"></i> YouTubeで視聴
        </a>
      </div>
    </div>

    <!-- Charts Grid Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- 累計再生数の推移グラフ -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 shadow-xl">
        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
          <i data-lucide="trending-up" class="w-4 h-4 text-cyan-400"></i> 累計再生数の推移
        </h3>
        <div class="h-64 w-full">
          <canvas id="viewsChart"></canvas>
        </div>
      </div>

      <!-- 日間再生数（0:15基準）の棒グラフ -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 shadow-xl flex flex-col justify-between">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="bar-chart-2" class="w-4 h-4 text-emerald-400"></i> 1日の再生数 (0:15基準)
          </h3>
          <span class="text-[10px] text-slate-400">※バーをクリックして絞り込み</span>
        </div>
        <div class="h-60 w-full">
          <canvas id="dailyBarChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Historical Data Table -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="table" class="w-4 h-4 text-purple-400"></i> 時間ごとの推移表 (直近30件)
          </h3>
          <span id="tableFilterStatus" class="text-[10px] bg-cyan-500/20 text-cyan-400 px-2 py-0.5 rounded hidden"></span>
        </div>
        <button id="resetFilterBtn" onclick="resetFilter()" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-2.5 py-1 rounded hidden transition">
          フィルター解除（全表示）
        </button>
      </div>
      <div class="overflow-x-auto max-h-80">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-800/60 text-slate-400 uppercase sticky top-0">
            <tr>
              <th class="p-3">確認日時 (updated_at)</th>
              <th class="p-3 text-right">再生数 (views)</th>
              <th class="p-3 text-right">増加分 (hourly_inclease)</th>
              <th class="p-3 text-right">高評価数 (like_count)</th>
            </tr>
          </thead>
          <tbody id="logTableBody" class="divide-y divide-slate-800">
            <!-- JavaScriptで動的に挿入されます -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Script for BigQuery Schema Mapping, Cross-filtering & Custom Title Protection -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('id');

    let allLogsForSong = [];
    let viewsChartInstance = null;
    let dailyBarChartInstance = null;
    let isAdminMode = localStorage.getItem('voca_admin_mode') === 'true';

    function initSongPage() {
      if (!videoId) {
        document.getElementById('songTitle').innerText = '楽曲IDが指定されていません。';
        return;
      }

      updateAdminUI();

      // BigQueryの t_hourly_logs_30d 相当の全ログ配列を取得
      const allLogs = JSON.parse(localStorage.getItem('vocaloid_tracker_logs_30d')) || getSampleLogs(videoId);

      allLogsForSong = allLogs
        .filter(log => log.video_id === videoId)
        .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

      if (allLogsForSong.length === 0) {
        document.getElementById('songTitle').innerText = `動画ID: ${videoId} のデータが見つかりません`;
        document.getElementById('videoIdDisplay').innerText = `ID: ${videoId}`;
        document.getElementById('youtubeLink').href = `https://www.youtube.com/watch?v=${videoId}`;
        return;
      }

      const latest = allLogsForSong[0];
      
      // 【タイトル保護ロジック】BigQuery由来のタイトルではなく、ユーザーがカスタム編集したタイトルがあれば優先する
      const customTitles = JSON.parse(localStorage.getItem('voca_custom_titles')) || {};
      const displayTitle = customTitles[videoId] || latest.title || `動画ID: ${videoId}`;

      document.getElementById('songTitle').innerText = displayTitle;
      document.getElementById('songProducer').innerText = latest.producer || '不明なP';
      document.getElementById('videoIdDisplay').innerText = `ID: ${videoId}`;
      document.getElementById('youtubeLink').href = `https://www.youtube.com/watch?v=${videoId}`;

      // グラフ用データ構築（時系列昇順）
      const chronologicalLogs = [...allLogsForSong].reverse();
      const labels = chronologicalLogs.map(l => l.updated_at);
      const viewValues = chronologicalLogs.map(l => l.views);

      // 日間データ集計
      const dailyMap = {};
      chronologicalLogs.forEach(l => {
        const dayStr = l.updated_at.split(' ')[0];
        if (!dailyMap[dayStr]) dailyMap[dayStr] = 0;
        dailyMap[dayStr] += (l.hourly_inclease || 0);
      });
      const dailyLabels = Object.keys(dailyMap);
      const dailyValues = Object.values(dailyMap);

      // 描画
      renderViewsChart(labels, viewValues);
      renderDailyBarChart(dailyLabels, dailyValues, chronologicalLogs);
      renderLogTable(allLogsForSong.slice(0, 30)); // 直近30件制限
    }

    // 管理者モードの切り替え (デモ用：ボタンでON/OFF可能)
    function toggleAdminMode() {
      isAdminMode = !isAdminMode;
      localStorage.setItem('voca_admin_mode', isAdminMode);
      updateAdminUI();
    }

    function updateAdminUI() {
      const indicator = document.getElementById('adminStatusIndicator');
      const editBtn = document.getElementById('editTitleBtn');
      const toggleBtn = document.getElementById('adminToggleBtn');

      if (isAdminMode) {
        indicator.innerText = '🔓 管理者モード';
        indicator.className = 'text-xs text-cyan-400 font-bold';
        editBtn.classList.remove('hidden');
        toggleBtn.innerText = '一般モードへ';
      } else {
        indicator.innerText = '🔒 一般閲覧モード';
        indicator.className = 'text-xs text-slate-400';
        editBtn.classList.add('hidden');
        toggleBtn.innerText = '管理者切替';
        cancelTitleEdit();
      }
    }

    function enableTitleEdit() {
      const currentTitle = document.getElementById('songTitle').innerText;
      document.getElementById('editTitleInput').value = currentTitle;
      document.getElementById('songTitle').classList.add('hidden');
      document.getElementById('editTitleBtn').classList.add('hidden');
      document.getElementById('editTitleContainer').classList.remove('hidden');
    }

    function cancelTitleEdit() {
      document.getElementById('songTitle').classList.remove('hidden');
      if (isAdminMode) document.getElementById('editTitleBtn').classList.remove('hidden');
      document.getElementById('editTitleContainer').classList.add('hidden');
    }

    // 【カスタムタイトルの保存】BigQueryからの再読み込み上書きを防ぎつつローカルに保持
    function saveCustomTitle() {
      const newTitle = document.getElementById('editTitleInput').value.trim();
      if (!newTitle) return;

      const customTitles = JSON.parse(localStorage.getItem('voca_custom_titles')) || {};
      customTitles[videoId] = newTitle;
      localStorage.setItem('voca_custom_titles', JSON.stringify(customTitles));

      document.getElementById('songTitle').innerText = newTitle;
      cancelTitleEdit();
      alert('タイトルを保存しました！今後BigQueryデータを更新してもこのタイトルが維持されます。');
    }

    function renderViewsChart(labels, data) {
      const ctx = document.getElementById('viewsChart').getContext('2d');
      if (viewsChartInstance) viewsChartInstance.destroy();

      viewsChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '累計再生数 (views)',
            data: data,
            borderColor: '#06b6d4',
            backgroundColor: 'rgba(6, 182, 212, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } }
          }
        }
      });
    }

    function renderDailyBarChart(labels, data, chronologicalLogs) {
      const ctx = document.getElementById('dailyBarChart').getContext('2d');
      if (dailyBarChartInstance) dailyBarChartInstance.destroy();

      dailyBarChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '増加分合算',
            data: data,
            backgroundColor: '#0ea5e9',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          onClick: (event, elements) => {
            if (elements.length > 0) {
              const index = elements[0].index;
              const selectedDay = labels[index];
              filterByDay(selectedDay, chronologicalLogs);
            }
          },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } }
          }
        }
      });
    }

    // クロスフィルタリング（日別絞り込み）
    function filterByDay(dayStr, chronologicalLogs) {
      const filtered = allLogsForSong.filter(l => l.updated_at.startsWith(dayStr));
      renderLogTable(filtered.slice(0, 30));

      const statusBadge = document.getElementById('tableFilterStatus');
      statusBadge.innerText = `表示日: ${dayStr}`;
      statusBadge.classList.remove('hidden');
      document.getElementById('resetFilterBtn').classList.remove('hidden');

      const dayLogs = chronologicalLogs.filter(l => l.updated_at.startsWith(dayStr));
      if (dayLogs.length > 0) {
        renderViewsChart(dayLogs.map(l => l.updated_at), dayLogs.map(l => l.views));
      }
    }

    function resetFilter() {
      renderLogTable(allLogsForSong.slice(0, 30));
      const chronologicalLogs = [...allLogsForSong].reverse();
      renderViewsChart(chronologicalLogs.map(l => l.updated_at), chronologicalLogs.map(l => l.views));

      document.getElementById('tableFilterStatus').classList.add('hidden');
      document.getElementById('resetFilterBtn').classList.add('hidden');
    }

    function renderLogTable(logs) {
      const tbody = document.getElementById('logTableBody');
      if (!logs || logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">ログデータがありません</td></tr>`;
        return;
      }
      tbody.innerHTML = logs.map(log => `
        <tr class="hover:bg-slate-800/40 transition">
          <td class="p-3 text-slate-400">${log.updated_at}</td>
          <td class="p-3 text-right font-medium text-slate-200">${(log.views || 0).toLocaleString()}</td>
          <td class="p-3 text-right text-cyan-400">+${(log.hourly_inclease || 0).toLocaleString()}</td>
          <td class="p-3 text-right text-slate-300">${(log.like_count || 0).toLocaleString()}</td>
        </tr>
      `).join('');
    }

    function getSampleLogs(vid) {
      return [
        { video_id: vid, title: 'サンプル楽曲 / 初音ミク', producer: 'サンプルP', views: 230035917, hourly_inclease: 7771, like_count: 2251047, updated_at: '2026/11/02 09:00:25' },
        { video_id: vid, title: 'サンプル楽曲 / 初音ミク', producer: 'サンプルP', views: 230028146, hourly_inclease: 9454, like_count: 2251023, updated_at: '2026/11/02 08:00:30' },
        { video_id: vid, title: 'サンプル楽曲 / 初音ミク', producer: 'サンプルP', views: 230018692, hourly_inclease: 7481, like_count: 2250979, updated_at: '2026/11/02 07:00:40' }
      ];
    }

    window.onload = () => {
      initSongPage();
      lucide.createIcons();
    };
  </script>
</body>
</html>
