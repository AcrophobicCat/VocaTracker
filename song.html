    <!-- Historical Data Table -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBFxeCvbpyj0_skQ5O7ZjGQz5EJ5YvQEmw",
      authDomain: "vocaloid-song-trackar.firebaseapp.com",
      projectId: "youtube-vocaloid-song-trackar",
      storageBucket: "youtube-vocaloid-song-trackar.firebasestorage.app",
      messagingSenderId: "543125801305",
      appId: "1:543125801305:web:7556f46309f798105f6448",
      measurementId: "G-L6NMKP7QQQ"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
  </script>

  <!-- Application Logic Script -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('id');

    let allLogsForSong = [];
    let viewsChartInstance = null;
    let dailyBarChartInstance = null;
    let isAdminMode = localStorage.getItem('voca_admin_mode') === 'true';

    function formatDateTime(rawDate) {
      if (!rawDate) return '---';
      if (typeof rawDate === 'string' && rawDate.includes('/')) {
        return rawDate;
      }

      let d = new Date(rawDate);
      if (isNaN(d.getTime()) && !isNaN(Number(rawDate))) {
        let num = Number(rawDate);
        if (num < 10000000000) num *= 1000;
        d = new Date(num);
      }

      if (isNaN(d.getTime())) {
        return String(rawDate);
      }

      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');

      return `${yyyy}/${mm}/${dd} ${hh}:${min}:${ss}`;
    }

    function getShiftedDayStr(dateStr) {
      const d = new Date(dateStr);
      const shifted = new Date(d.getTime() - 30 * 60 * 1000);
      const yyyy = shifted.getFullYear();
      const mm = String(shifted.getMonth() + 1).padStart(2, '0');
      const dd = String(shifted.getDate()).padStart(2, '0');
      return `${yyyy}/${mm}/${dd}`;
    }

    async function initSongPage() {
      if (!videoId) {
        document.getElementById('songTitle').innerText = '楽曲IDが指定されていません。';
        return;
      }

      updateAdminUI();

      const thumbnailUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      document.getElementById('songThumbnail').src = thumbnailUrl;
      document.getElementById('thumbnailLink').href = `https://www.youtube.com/watch?v=${videoId}`;

      let allLogs = [];
      try {
        const response = await fetch('vocaloid_tracker_logs_30d.json');
        if (response.ok) {
          allLogs = await response.json();
          localStorage.setItem('vocaloid_tracker_logs_30d', JSON.stringify(allLogs));
        }
      } catch (e) {
        console.log('JSONの非同期取得に失敗しました。localStorageを使用します。', e);
      }

      if (!allLogs || allLogs.length === 0) {
        allLogs = JSON.parse(localStorage.getItem('vocaloid_tracker_logs_30d')) || getSampleLogs(videoId);
      }

      allLogsForSong = allLogs
        .filter(log => log.video_id === videoId)
        .map(log => ({
          ...log,
          updated_at: formatDateTime(log.updated_at)
        }))
        .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

      if (allLogsForSong.length === 0) {
        document.getElementById('songTitle').innerText = `動画ID: ${videoId} のデータが見つかりません`;
        document.getElementById('videoIdDisplay').innerText = `ID: ${videoId}`;
        document.getElementById('youtubeLink').href = `https://www.youtube.com/watch?v=${videoId}`;
        return;
      }

      const latest = allLogsForSong[0];
      
      const customTitles = JSON.parse(localStorage.getItem('voca_custom_titles')) || {};
      const displayTitle = customTitles[videoId] || latest.title || `動画ID: ${videoId}`;
      document.getElementById('songTitle').innerText = displayTitle;

      const customProducers = JSON.parse(localStorage.getItem('voca_custom_producers')) || {};
      const displayProducer = customProducers[videoId] || latest.producer || '不明なP';
      document.getElementById('songProducer').innerText = displayProducer;

      document.getElementById('videoIdDisplay').innerText = `ID: ${videoId}`;
      document.getElementById('youtubeLink').href = `https://www.youtube.com/watch?v=${videoId}`;

      document.getElementById('statCurrentViews').innerText = (latest.views || 0).toLocaleString();
      document.getElementById('statHourlyInc').innerText = `+${(latest.hourly_inclease || 0).toLocaleString()}`;
      document.getElementById('statLikes').innerText = (latest.like_count || 0).toLocaleString();

      renderTags();
      updateTagSuggestions();

      const chronologicalLogs = [...allLogsForSong].reverse();
      const labels = chronologicalLogs.map(l => l.updated_at);
      const viewValues = chronologicalLogs.map(l => l.views);

      const dailyMap = {};
      chronologicalLogs.forEach(l => {
        const dayStr = getShiftedDayStr(l.updated_at);
        if (!dailyMap[dayStr]) dailyMap[dayStr] = 0;
        dailyMap[dayStr] += (l.hourly_inclease || 0);
      });
      const dailyLabels = Object.keys(dailyMap);
      const dailyValues = Object.values(dailyMap);

      renderViewsChart(labels, viewValues);
      renderDailyBarChart(dailyLabels, dailyValues, chronologicalLogs);
      
      renderLogTable(allLogsForSong);
    }

    function toggleMobileMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('hidden');
    }

    function getSongTags() {
      const allTags = JSON.parse(localStorage.getItem('voca_song_tags')) || {};
      return allTags[videoId] || { 
        vocal: ['初音ミク'], 
        credit: ['Music: サンプルP'], 
        free: ['ボカロ曲', '新曲'] 
      };
    }

    function saveSongTags(tagsObj) {
      const allTags = JSON.parse(localStorage.getItem('voca_song_tags')) || {};
      allTags[videoId] = tagsObj;
      localStorage.setItem('voca_song_tags', JSON.stringify(allTags));

      updateMasterList('voca_master_vocal_tags', tagsObj.vocal, ['初音ミク', '鏡音リン', '鏡音レン', 'GUMI', '重音テト']);
      updateMasterList('voca_master_credit_tags', tagsObj.credit, ['Music: サンプルP', 'Illustration: ゲスト', 'Mix: エンジニア']);
      updateMasterList('voca_master_free_tags', tagsObj.free, ['ボカロ曲', '新曲', 'ミリオン達成', '神曲', 'EDM']);

      renderTags();
      updateTagSuggestions();
    }

    function updateMasterList(storageKey, currentValues, defaults) {
      let master = JSON.parse(localStorage.getItem(storageKey)) || defaults;
      currentValues.forEach(t => {
        if (!master.includes(t)) master.push(t);
      });
      localStorage.setItem(storageKey, JSON.stringify(master));
    }

    function renderTags() {
      const tags = getSongTags();
      
      const vContainer = document.getElementById('vocalTagsContainer');
      vContainer.innerHTML = tags.vocal.map(t => {
        let deleteBtn = isAdminMode ? `<button onclick="removeTag('vocal', '${t}')" class="hover:text-red-400 font-bold ml-1">×</button>` : '';
        return `<span class="bg-purple-900/40 text-purple-300 border border-purple-700/50 text-xs px-2.5 py-0.5 rounded-full flex items-center gap-1">${t} ${deleteBtn}</span>`;
      }).join('') || '<span class="text-xs text-slate-500">未設定</span>';

      const cContainer = document.getElementById('creditTagsContainer');
      cContainer.innerHTML = tags.credit.map(t => {
        let deleteBtn = isAdminMode ? `<button onclick="removeTag('credit', '${t}')" class="hover:text-red-400 font-bold ml-1">×</button>` : '';
        return `<span class="bg-indigo-900/40 text-indigo-300 border border-indigo-700/50 text-xs px-2.5 py-0.5 rounded-full flex items-center gap-1">${t} ${deleteBtn}</span>`;
      }).join('') || '<span class="text-xs text-slate-500">未設定</span>';

      const fContainer = document.getElementById('freeTagsContainer');
      fContainer.innerHTML = tags.free.map(t => {
        let deleteBtn = isAdminMode ? `<button onclick="removeTag('free', '${t}')" class="hover:text-red-400 font-bold ml-1">×</button>` : '';
        return `<span class="bg-cyan-900/40 text-cyan-300 border border-cyan-700/50 text-xs px-2.5 py-0.5 rounded-full flex items-center gap-1">${t} ${deleteBtn}</span>`;
      }).join('') || '<span class="text-xs text-slate-500">タグなし</span>';
    }

    function updateTagSuggestions() {
      const masterVocal = JSON.parse(localStorage.getItem('voca_master_vocal_tags')) || ['初音ミク', '鏡音リン', '鏡音レン', 'GUMI', '重音テト'];
      document.getElementById('vocalMasterList').innerHTML = masterVocal.map(t => `<option value="${t}"></option>`).join('');

      const masterCredit = JSON.parse(localStorage.getItem('voca_master_credit_tags')) || ['Music: サンプルP', 'Illustration: ゲスト'];
      document.getElementById('creditMasterList').innerHTML = masterCredit.map(t => `<option value="${t}"></option>`).join('');

      const masterFree = JSON.parse(localStorage.getItem('voca_master_free_tags')) || ['ボカロ曲', '新曲', 'ミリオン達成', '神曲', 'EDM'];
      document.getElementById('freeMasterList').innerHTML = masterFree.map(t => `<option value="${t}"></option>`).join('');
    }

    function addTag(type) {
      if ((type === 'vocal' || type === 'credit') && !isAdminMode) return;
      
      const inputId = type === 'vocal' ? 'newVocalTagInput' : (type === 'credit' ? 'newCreditTagInput' : 'newFreeTagInput');
      const input = document.getElementById(inputId);
      const val = input.value.trim();
      if (!val) return;

      const tags = getSongTags();
      if (!tags[type].includes(val)) {
        tags[type].push(val);
        saveSongTags(tags);
      }
      input.value = '';
    }

    function removeTag(type, tagToRemove) {
      if (!isAdminMode) return;
      const tags = getSongTags();
      tags[type] = tags[type].filter(t => t !== tagToRemove);
      saveSongTags(tags);
    }

    function enableProducerEdit() {
      const currentProducer = document.getElementById('songProducer').innerText;
      document.getElementById('editProducerInput').value = currentProducer;
      document.getElementById('songProducer').parentElement.parentElement.classList.add('hidden');
      document.getElementById('editProducerContainer').classList.remove('hidden');
    }

    function cancelProducerEdit() {
      document.getElementById('songProducer').parentElement.parentElement.classList.remove('hidden');
      document.getElementById('editProducerContainer').classList.add('hidden');
    }

    function saveCustomProducer() {
      const newProducer = document.getElementById('editProducerInput').value.trim();
      if (!newProducer) return;
      const customProducers = JSON.parse(localStorage.getItem('voca_custom_producers')) || {};
      customProducers[videoId] = newProducer;
      localStorage.setItem('voca_custom_producers', JSON.stringify(customProducers));
      document.getElementById('songProducer').innerText = newProducer;
      cancelProducerEdit();
    }

    function toggleAdminMode() {
      isAdminMode = !isAdminMode;
      localStorage.setItem('voca_admin_mode', isAdminMode);
      updateAdminUI();
      renderTags();
    }

    function updateAdminUI() {
      const indicator = document.getElementById('adminStatusIndicator');
      const mobileIndicator = document.getElementById('mobileAdminStatusIndicator');
      const editBtn = document.getElementById('editTitleBtn');
      const editProducerBtn = document.getElementById('editProducerBtn');
      
      const vocalEditContainer = document.getElementById('vocalEditContainer');
      const creditEditContainer = document.getElementById('creditEditContainer');

      if (isAdminMode) {
        const text = '🔓 管理者モード';
        const className = 'text-xs text-cyan-400 font-bold';
        indicator.innerText = text;
        indicator.className = className;
        mobileIndicator.innerText = text;
        mobileIndicator.className = className;
        editBtn.classList.remove('hidden');
        editProducerBtn.classList.remove('hidden');
        vocalEditContainer.classList.remove('hidden');
        creditEditContainer.classList.remove('hidden');
      } else {
        const text = '🔒 一般閲覧モード';
        const className = 'text-xs text-slate-400';
        indicator.innerText = text;
        indicator.className = className;
        mobileIndicator.innerText = text;
        mobileIndicator.className = className;
        editBtn.classList.add('hidden');
        editProducerBtn.classList.add('hidden');
        vocalEditContainer.classList.add('hidden');
        creditEditContainer.classList.add('hidden');
        cancelTitleEdit();
        cancelProducerEdit();
      }
    }

    function enableTitleEdit() {
      const currentTitle = document.getElementById('songTitle').innerText;
      document.getElementById('editTitleInput').value = currentTitle;
      document.getElementById('songTitle').classList.add('hidden');
      document.getElementById('editTitleBtn').classList.add('hidden');
      document.getElementById('editTitleContainer').classList.remove('hidden');
    }

    function cancelTitleEdit() {
      document.getElementById('songTitle').classList.remove('hidden');
      if (isAdminMode) document.getElementById('editTitleBtn').classList.remove('hidden');
      document.getElementById('editTitleContainer').classList.add('hidden');
    }

    function saveCustomTitle() {
      const newTitle = document.getElementById('editTitleInput').value.trim();
      if (!newTitle) return;
      const customTitles = JSON.parse(localStorage.getItem('voca_custom_titles')) || {};
      customTitles[videoId] = newTitle;
      localStorage.setItem('voca_custom_titles', JSON.stringify(customTitles));
      document.getElementById('songTitle').innerText = newTitle;
      cancelTitleEdit();
    }

    function renderViewsChart(labels, data) {
      const ctx = document.getElementById('viewsChart').getContext('2d');
      if (viewsChartInstance) viewsChartInstance.destroy();

      viewsChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '累計再生数 (views)',
            data: data,
            borderColor: '#06b6d4',
            backgroundColor: 'rgba(6, 182, 212, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } }
          }
        }
      });
    }

    function renderDailyBarChart(labels, data, chronologicalLogs) {
      const ctx = document.getElementById('dailyBarChart').getContext('2d');
      if (dailyBarChartInstance) dailyBarChartInstance.destroy();

      dailyBarChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '増加分合算',
            data: data,
            backgroundColor: '#0ea5e9',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          onClick: (event, elements) => {
            if (elements.length > 0) {
              const index = elements[0].index;
              const selectedDay = labels[index];
              filterByDay(selectedDay, chronologicalLogs);
            }
          },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } }
          }
        }
      });
    }

    function filterByDay(dayStr, chronologicalLogs) {
      const filtered = allLogsForSong.filter(l => getShiftedDayStr(l.updated_at) === dayStr);
      renderLogTable(filtered);

      const statusBadge = document.getElementById('tableFilterStatus');
      statusBadge.innerText = `表示日(0:30基準): ${dayStr}`;
      statusBadge.classList.remove('hidden');
      document.getElementById('resetFilterBtn').classList.remove('hidden');

      const dayLogs = chronologicalLogs.filter(l => getShiftedDayStr(l.updated_at) === dayStr);
      if (dayLogs.length > 0) {
        renderViewsChart(dayLogs.map(l => l.updated_at), dayLogs.map(l => l.views));
      }
    }

    function resetFilter() {
      renderLogTable(allLogsForSong);
      const chronologicalLogs = [...allLogsForSong].reverse();
      renderViewsChart(chronologicalLogs.map(l => l.updated_at), chronologicalLogs.map(l => l.views));

      document.getElementById('tableFilterStatus').classList.add('hidden');
      document.getElementById('resetFilterBtn').classList.add('hidden');
    }

    function renderLogTable(logs) {
      const tbody = document.getElementById('logTableBody');
      if (!logs || logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">ログデータがありません</td></tr>`;
        return;
      }
      tbody.innerHTML = logs.map(log => `
        <tr class="hover:bg-slate-800/40 transition">
          <td class="p-3 text-slate-400">${log.updated_at}</td>
          <td class="p-3 text-right font-medium text-slate-200">${(log.views || 0).toLocaleString()}</td>
          <td class="p-3 text-right text-cyan-400">+${(log.hourly_inclease || 0).toLocaleString()}</td>
          <td class="p-3 text-right text-slate-300">${(log.like_count || 0).toLocaleString()}</td>
        </tr>
      `).join('');
    }

    function getSampleLogs(vid) {
      return [
        { video_id: vid, title: 'サンプル楽曲 / 初音ミク', producer: 'サンプルP', views: 230035917, hourly_inclease: 7771, like_count: 2251047, updated_at: '2026/11/02 09:00:25' }
      ];
    }

    window.onload = () => {
      initSongPage();
      lucide.createIcons();
    };
  </script>
</body>
</html>
